# Our pipeline, on ETH Euler, driving RFD3 / LigandMPNN / Boltz-2 directly.
#
#   python -m src.cli run --pipeline config/pipeline.euler.yaml \
#                         --target config/targets/01_his_asp.yaml --name euler-01
#
# This is OUR runner calling the stock tools. Nothing here goes through the
# organisers' template, their prepare_*/verify_* helpers, or their validation
# layer, and there is no MMseqs2 step -- we submit single-sequence to Boltz and
# do the scoring ourselves.
#
# Paths are where the tools were staged on Euler. $SCRATCH is purged after
# ~2 weeks, so if a run fails on a missing checkpoint, that is why.
#
# SIZE OF THE RUN
#   cycle 0    5 backbones x 3 sequences              = 15 designs
#   cycle 1    wiggle 2 parents x 2 x 3 = 12,
#              mutate 2 parents x 2     =  4          = 16
#   total                                               31 Boltz-2 calls

run:
  name: null
  seed: 1
  # One GPU per Euler job. Asking for two would queue for a node that has two
  # free and gains nothing: Boltz on a ~270-token system fits one card.
  gpus: [0]
  max_cycles: 1
  patience: 2
  min_delta: 0.005
  eval_replicates: 1

rfd3:
  binary: /cluster/home/malexandrov/pm-rfd3-env/bin/rfd3
  checkpoint: /cluster/scratch/malexandrov/pdh/weights/rfd3/rfd3_latest.ckpt
  n_batches: 5                 # 5 backbones at cycle 0
  diffusion_batch_size: 1
  partial_T: 10                # the wiggle's re-noising depth
  extra_args: []

# Not used on this cluster; kept null so the schema is explicit about it.
rfdiffusion: null

ligandmpnn:
  run_script: /cluster/scratch/malexandrov/pdh/tools/LigandMPNN/run.py
  checkpoint: /cluster/scratch/malexandrov/pdh/tools/ligandmpnn/ligandmpnn_v_32_010_25.pt
  temperature: 0.1
  sequences_per_backbone: 3
  omit_AA: "CX"
  pack_side_chains: false
  use_atom_context: true
  use_side_chain_context: true

boltz:
  binary: /cluster/home/malexandrov/pm-boltz-env/bin/boltz
  cache_dir: /cluster/scratch/malexandrov/pdh/boltz-cache
  # The weights are staged read-only; the wrapper symlinks them into cache_dir
  # rather than letting Boltz download 6 GB on a node with no internet.
  assets_dir: /cluster/scratch/malexandrov/pdh/cache
  recycling_steps: 3
  diffusion_samples: 1
  sampling_steps: 200
  use_potentials: false
  # Euler's A100s are Ampere, so the optimised kernels should work -- but this
  # has not been confirmed on a real prediction, and a wrong guess here is a
  # crash mid-run rather than a slowdown. Leave true until phase 0 says so.
  no_kernels: true
  precision: "32"
  max_tokens: 400
  accelerator: gpu
  devices: 1

protonation:
  engine: pdbfixer
  ph: 7.0

scoring:
  weights:
    confidence: 0.70
    geometry: 0.30
  geometry_weights:
    distance: 0.60
    angle: 0.40
  confidence:
    metric: complex_ipde
    ipde_best: 0.5
    ipde_worst: 5.0
  distance:
    ideal: 2.9
    tolerated: 3.5
    fail: 4.5
    clash: 2.2
  angle:
    tolerance: 60.0
    rule: acceptor_side_always
  aggregate: mean

search:
  keep_per_cycle: 2
  wiggle:
    enabled: true
    parents_per_cycle: 2
    source: rfdiffusion_backbone
    designs_per_parent: 2
  mutate:
    enabled: true
    parents_per_cycle: 2
    shell_radius: 5.0
    alphabet: "ADEFGHIKLMNQRSTVWY"
    max_mutants_per_parent: 2
