# 5FQJ / HG3 Kemp eliminase pocket, ligand 6NT (5-nitrobenzotriazole).
#
# PROVENANCE OF EVERY NUMBER IN THIS FILE
#
# Residue identities and all distances/angles below were measured directly from
# data/5A_5FQJ.pdb in this repo (altloc A where present), not copied from a
# paper. Reproduce them with:
#     python -m src.cli measure --target config/targets/5fqj.yaml --pdb data/5A_5FQJ.pdb
#
# The two scored contacts are the ones RUNLOG.md identifies as the catalytic
# constellation: the base ASP OD2 to the acidic N3-H of the benzotriazole, and
# the donor NE2 to N1.
#
# TWO THINGS TO SETTLE IN PHASE 1 -- both are flagged, neither is guessed:
#
# 1. The donor residue. In this seed the NE2 donor is HIS291. The organisers'
#    reference motif (RUNLOG.md section 1) uses a GLN at the equivalent
#    position, and 4BS0 has the donor mutated away entirely. If the intended
#    motif is GLN, change resnum/atom below and re-measure; do not assume the
#    angle carries over.
# 2. The base angle. Measured here as CG-OD2...N3 = 106.6 deg. RUNLOG.md
#    section 3 reports 130.9 deg for the same contact in 4BS0. Different
#    structures, so both can be right, but acceptor_ideal_angle below uses the
#    value measured in THIS seed and should be revisited once the reference
#    structure is chosen.
#
# System size: 260 protein tokens + 12 ligand heavy atoms = ~272 tokens, inside
# the 300-token preference in PIPELINE.md and well under boltz.max_tokens.

name: 5fqj

seeds:
  # Chain A, residues 27-294 as deposited; 260 residues in the designed
  # sequence. The two arms differ only in how much of the pocket was held in
  # the run that produced them, which is why they are separate searches.
  #
  # NOTE: `contigs` is in RFdiffusion partial-diffusion syntax -- a single
  # fixed-length span, with the motif held through motif.fixed below. The
  # previous runs in data/No_mutation_run used RFD3, whose `contig` +
  # `select_fixed_atoms` syntax is NOT the same thing. Confirm this string
  # against the actual RFdiffusion build in phase 1 before trusting a run.
  - {id: seed_5a,  pdb: data/5A_5FQJ.pdb,  contigs: "260-260"}
  - {id: seed_10a, pdb: data/10A_5FQJ.pdb, contigs: "260-260"}

ligand:
  id: 6NT
  ccd: 6NT                   # a real CCD code, so atom names resolve directly
  smiles: null               # unused while ccd is set
  reference_sdf: null        # only needed on the SMILES path

motif:
  fixed:                     # whole residues, never mutated, never redesigned
    - {chain: A, resnum: 229}   # ASP, catalytic base
    - {chain: A, resnum: 291}   # HIS, NE2 donor (see note 1 above)
  # The earlier no-mutation run additionally held the whole 5 A pocket shell:
  # A48 A225 A226 A229 A250 A252 A254 A256 A259 A261 A286 A287 A290 A291.
  # Holding only the two H-bonding residues gives the search more room; add the
  # rest here if designs keep losing the pocket.

hbonds:
  - id: lig_n3_to_asp229_od2
    # The benzotriazole N3-H donates to the carboxylate. Donor H is on the
    # ligand and its position is fixed by the aromatic ring.
    donor:     {site: ligand,  atom: N3}
    acceptor:  {site: protein, chain: A, resnum: 229, atom: OD2}
    acceptor_antecedent: {site: protein, chain: A, resnum: 229, atom: CG}
    rotatable_donor: false
    required: true
    acceptor_ideal_angle: 106.6   # measured: CG-OD2...N3 in data/5A_5FQJ.pdb
    # measured distance in the seed: 2.734 A

  - id: his291_ne2_to_lig_n1
    # Imidazole NE2-H donates to ligand N1. H position fixed by the ring.
    donor:     {site: protein, chain: A, resnum: 291, atom: NE2}
    donor_antecedent: {site: protein, chain: A, resnum: 291, atom: CD2}
    acceptor:  {site: ligand,  atom: N1}
    acceptor_antecedent: {site: ligand, atom: N2}
    rotatable_donor: false
    required: true
    acceptor_ideal_angle: 126.6   # measured: N2-N1...NE2 in data/5A_5FQJ.pdb
    # measured distance in the seed: 3.084 A
